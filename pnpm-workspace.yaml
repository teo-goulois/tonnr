packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  msgpackr-extract: true
  workerd: true
  # The Nucleo icons check the licence in NUCLEO_LICENSE_KEY when they install: decision 012.
  nucleo-micro-bold: true
  nucleo-ui-fill-18: true
  nucleo-ui-fill-duo-18: true
  nucleo-ui-outline-18: true
  core-js: false
  # Its CPU binaries come in the package: the script fetches CUDA's alone, which no instance
  # uses. Decision 067.
  onnxruntime-node: false
  protobufjs: false
catalog:
  zod: ^4.5.4
  typescript: ^7.0.2
  "@types/node": ^26.4.1
  varlock: 1.18.0
  "@orpc/server": ^1.15.0
  "@orpc/openapi": ^1.15.0
  "@orpc/zod": ^1.15.0
  better-auth: 1.7.7
  next-themes: ^0.4.6
  react: 19.3.0
  react-dom: 19.3.0
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  "@orpc/client": ^1.15.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  drizzle-orm: 1.0.0-rc.4
  "@neaps/tide-database": 0.9.20260907
  "@neaps/tide-predictor": 0.11.0
  effect: 4.0.0
# One copy of a package for each version, whatever optional peers another package brings: the
# app for phones brings expo-sqlite to drizzle-orm, which made a second copy of better-auth that
# the types of @repo/auth could not name.
dedupePeers: true
peerDependencyRules:
  # heroui-native 1.0.10 asks for gesture-handler 2, and Expo SDK 58 ships 3: its issue #524.
  # Decision 069.
  allowedVersions:
    heroui-native>react-native-gesture-handler: "3"
overrides:
  # drizzle-orm takes valibot as an optional peer and would otherwise share the 1.2.0 that
  # alchemy's tooling pins, which GHSA-5qjj-4xww-7phc names. Nothing here imports it.
  "drizzle-orm>valibot": ^1.4.2
# Expo SDK 58 came out on 2026-10-15: its packages are younger than the age pnpm waits for, and
# the app for phones needs them (decision 069). Drop each line once its version is old enough.
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.12 || 58.1.13"
  - "@expo/metro-config@58.0.15"
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-localization@58.0.5
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo-router@58.0.24
  - expo@58.0.15 || 58.0.16
  - uniwind@1.13.0
  - "@expo/router-server@58.0.15"
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - "@expo/ui@58.0.21"
  - expo-blur@58.0.5
  - expo-camera@58.0.11
  - expo-image@58.0.16
  - expo-location@58.0.18
  - expo-video@58.0.12
  - expo-widgets@58.0.21
