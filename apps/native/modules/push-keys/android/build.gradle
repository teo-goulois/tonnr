plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.tonnr'
version = '1.0.0'

android {
  namespace "app.tonnr.pushkeys"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // The service that opens a push takes the place of expo-notifications' and passes it the rest.
  // Expo 58 links expo-notifications as the artifact of its own local repository, which
  // autolinking adds to every project, and not as a project: its one version there is the app's.
  implementation 'host.exp.exponent:expo.modules.notifications:+'

  implementation 'com.google.firebase:firebase-messaging:24.1.2'
  implementation 'androidx.core:core-ktx:1.17.0'
}
