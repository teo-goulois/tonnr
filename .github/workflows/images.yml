name: Images

# Builds the two images and starts them on an empty database, as a first deployment does. This
# takes minutes, so on main it runs only for a change that can break an image or its start.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - .dockerignore
      - docker-compose.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/package.json"
      - "**/tsdown.config.ts"
      - "apps/*/src/start.ts"
      - apps/worker/src/cli.ts
      - packages/db/src/migrate.ts
      - "packages/db/src/migrations/**"
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  images:
    name: Build and start the images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the settings a deployment gives
        run: |
          cat > apps/server/.env <<EOF
          BETTER_AUTH_SECRET=$(openssl rand -base64 32)
          BETTER_AUTH_URL=http://localhost:3000
          CORS_ORIGIN=http://localhost:3001
          EOF
      - run: docker compose build
      - run: docker compose up --detach --wait --wait-timeout 60 postgres
      # The worker starts first, on an empty database, in a network with no way out: its start
      # sends one run to every data provider, and nothing here may reach them.
      - name: Start the worker on an empty database
        run: |
          docker network create --internal offline
          docker network connect --alias postgres offline "$(docker compose ps --quiet postgres)"
          docker run --detach --name worker --network offline \
            --env DATABASE_URL=postgresql://postgres:password@postgres:5432/app tonnr-worker
          for _ in $(seq 30); do
            if docker logs worker 2>&1 | grep --quiet "Scheduled ingest-"; then break; fi
            sleep 2
          done
          docker logs worker 2>&1 | grep "Migrations applied"
          docker logs worker 2>&1 | grep --max-count 1 "Scheduled ingest-"
      - name: Stop the worker
        run: |
          docker stop worker
          test "$(docker inspect --format '{{.State.ExitCode}}' worker)" = 0
      - name: Start the API on the database the worker migrated
        run: docker compose up --detach --wait --wait-timeout 120 server
      - name: Check that the API reads that database
        run: |
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/v1/openapi.json
          curl --fail --silent --show-error "http://localhost:3000/v1/stations?bbox=-6,47,-4,49"
      - name: Run one job in the worker's image
        run: docker compose run --rm worker node dist/cli.mjs exposure
      - name: Show the logs
        if: failure()
        run: |
          docker logs worker || true
          docker compose logs --no-color
