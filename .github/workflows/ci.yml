name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch replaces the run under way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job reads a secret, so a pull request from a fork gets the same checks.
permissions:
  contents: read

jobs:
  check:
    name: Lint, types, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The tests that need Postgres create databases of their own on this server.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Takes the version of pnpm from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Check that the schema has its migration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm --filter @repo/db run db:generate
          if [ -n "$(git status --porcelain -- packages/db/src/migrations)" ]; then
            echo "::error::The schema changed without a migration. Run 'pnpm run db:generate' and commit what it writes."
            git status --short -- packages/db/src/migrations
            exit 1
          fi
      # The check above compares the schema with the tool's own record of it. This one applies
      # the SQL to an empty database and compares what it built.
      - name: Check that the migrations build the schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm --filter @repo/db run db:migrate
          cd packages/db
          if ! pnpm exec drizzle-kit push --explain --output json | jq --exit-status '.statements | length == 0' > /dev/null; then
            echo "::error::A database built by the migrations differs from the schema:"
            pnpm exec drizzle-kit push --explain
            exit 1
          fi
      - name: Check that no migration already merged was edited
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          edited=$(git diff --name-only --diff-filter=MDR "origin/$BASE" HEAD -- packages/db/src/migrations)
          if [ -n "$edited" ]; then
            echo "::error::A database that applied a migration never applies it again. Write a new one instead of editing:"
            echo "$edited"
            exit 1
          fi

  images:
    name: Build and start the images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # With the second file the containers have no way out: starting the worker sends one run
      # to every data provider, and nothing here may reach them.
      COMPOSE_FILE: docker-compose.yml:.github/compose.offline.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the settings a deployment gives
        run: |
          cat > apps/server/.env <<EOF
          BETTER_AUTH_SECRET=$(openssl rand -base64 32)
          BETTER_AUTH_URL=http://localhost:3000
          CORS_ORIGIN=http://localhost:3001
          EOF
      - run: docker compose build
      - run: docker compose up --detach --wait --wait-timeout 60 postgres
      - name: Start the worker first, on an empty database
        run: |
          docker compose up --detach worker
          for _ in $(seq 30); do
            if docker compose logs worker | grep --quiet "Worker ready"; then break; fi
            sleep 2
          done
          docker compose logs worker | grep "Migrations applied"
          docker compose logs worker | grep "Worker ready"
      - name: Stop the worker
        run: |
          docker compose stop worker
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet worker)")" = 0
      - name: Start the API on the database the worker migrated
        run: docker compose up --detach --wait --wait-timeout 120 server
      - name: Check that the API reads that database
        run: |
          docker compose exec -T server node --input-type=module --eval "
            for (const path of ['/v1/openapi.json', '/v1/stations?bbox=-6,47,-4,49']) {
              const response = await fetch('http://localhost:3000' + path);
              if (!response.ok) throw new Error(path + ' answered ' + response.status);
              console.log(response.status, path);
            }
          "
      - name: Run one job in the worker's image
        run: docker compose run --rm worker node dist/cli.mjs exposure
      - name: Show the logs
        if: failure()
        run: docker compose logs --no-color
